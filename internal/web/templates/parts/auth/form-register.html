{{ define "parts/auth/form-register" }}

<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-4">
        <div id="result" class="my-3"></div>

        <form class="px-3" hx-post="/auth/register" hx-target="#result" hx-swap="innerHTML"> 
            <h1 class="h3 mb-3 fw-normal">Register</h1>
            <div class="mb-3">
                <input hx-validate="true" type="text" class="form-control" name="name" required placeholder="Name">
            </div>
            <div class="mb-3">
                <select hx-validate="true" name="role" class="form-select" aria-label="Choose role:" required placeholder="Email">
                    <option selected>Choose role:</option>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="mb-3">
                <input hx-validate="true" type="email" class="form-control" name="email" placeholder="Email">
            </div>
            <div class="mb-3">
                <input hx-validate="true" type="password" name="password" class="form-control" required placeholder="Password">
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-success col-12">Register</button>
            </div>
        </form>
    </div>
</div>

{{end}}
